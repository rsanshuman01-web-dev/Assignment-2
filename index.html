<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Async Weather Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #020617);
    padding: 20px;
}

/* container */
.container {
    max-width: 900px;
    margin: auto;
}

/* title */
h1 {
    text-align: center;
    color: white;
    margin-bottom: 30px;
}

/* REMOVE SIDE-BY-SIDE */
.parent-card {
    display: block;
}

/* card */
.card {
    background: #ffffff;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* SEARCH SECTION (TOP BIG BAR) */
.input-group {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
}

/* button */
button {
    padding: 14px 20px;
    background: #3b82f6;
    color: white;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #2563eb;
}

/* WEATHER BIG CARD */
#weather {
    margin-top: 10px;
}

/* WEATHER ITEMS LOOK LIKE CARDS */
.weather-item {
    display: flex;
    justify-content: space-between;
    padding: 16px;
    margin-bottom: 10px;
    border-radius: 12px;
    background: #f1f5f9;
    font-size: 16px;
    font-weight: 500;
}

/* HISTORY SECTION */
.history {
    margin-top: 10px;
}

.history button {
    margin: 6px;
    padding: 8px 16px;
    border-radius: 25px;
    background: #1e293b;
    color: white;
    font-size: 14px;
}

.history button:hover {
    background: #0f172a;
}
    </style>
</head>

<body>
    <div class="container">

        <h1>🌤 Async Weather Tracker</h1>

        <div class="parent-card">
            <div class="card">
                <h3>Search City</h3>
                <div class="input-group">
                    <input id="cityInput" placeholder="Delhi, London">
                    <button id="searchBtn">Search</button>
                </div>
                <br>
                <br>
                <h3>Search History</h3>
                <div class="history" id="history"></div>
            </div>

            <div class="card">
                <h3>Weather Info</h3>
                <div id="weather"></div>
            </div>
        </div>

        <!-- <div class="card">
            <h3>Console – Event Loop</h3>
            <div class="console" id="console"></div>
        </div> -->

    </div>

    <script>
        const API_KEY = "ebf8f3d24447086b2368a875524b9766";
        //    const API_KEY = "ebf8f3d24447086b2368a875524b9766";

        const weatherBox = document.getElementById("weather");
        const historyBox = document.getElementById("history");

        /* ---------- WEATHER FETCH ---------- */
        async function getWeather(city) {

            // small delay for smoother UI
            // await new Promise(r => setTimeout(r, 500));

            const res = await fetch(
                `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`
            );
            if (!res.ok) {
                alert("city not found");
                throw new Error("City not found");
            }
            const data = await res.json();
            return data;
        }

         /* ---------- BUTTON CLICK ---------- */
        document.getElementById("searchBtn").onclick = () => {
            const city = cityInput.value.trim();
            if (city) {
                search(city);
            }
        };

        /* ---------- UI RENDER ---------- */
        function renderWeather(d) {
            weatherBox.innerHTML = `
        <div class="weather-item"><label>City</label><span>${d.name}, ${d.sys.country}</span></div>
        <div class="weather-item"><label>Temperature</label><span>${d.main.temp} °C</span></div>
        <div class="weather-item"><label>Weather</label><span>${d.weather[0].main}</span></div>
        <div class="weather-item"><label>Humidity</label><span>${d.main.humidity}%</span></div>
        <div class="weather-item"><label>Wind Speed</label><span>${d.wind.speed} m/s</span></div>
    `;
        }

        /* ---------- SAVE SEARCH HISTORY ---------- */
        function saveHistory(city) {
    let history = JSON.parse(localStorage.getItem("weatherHistory")) || [];

    if (!history.includes(city)) {
        history.push(city);
        localStorage.setItem("weatherHistory", JSON.stringify(history));
    }

    showHistory();
}


        /* ---------- SHOW HISTORY ---------- */
        function showHistory() {
    let history = JSON.parse(localStorage.getItem("weatherHistory")) || [];

    historyBox.innerHTML = "";

    history.forEach(city => {
        const btn = document.createElement("button");
        btn.innerText = city;

        btn.onclick = () => {
            search(city);
        };

        historyBox.appendChild(btn);
    });
}

        /* ---------- SEARCH FUNCTION ---------- */
        async function search(city) {
            weatherBox.innerHTML = "";
            try {
                const data = await getWeather(city);
                renderWeather(data);
                saveHistory(data.name); 
            } catch (error) {
                weatherBox.innerHTML = `<p style="color:red">${error.message}</p>`;
            }
        }
       
        /* ---------- ENTER KEY SEARCH ---------- */
        cityInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const city = cityInput.value.trim();
                if (city) {
                    search(city);
                }
            }
        });
        /* ---------- INITIAL LOAD ---------- */
        showHistory();
    </script>
</body>

</html>
